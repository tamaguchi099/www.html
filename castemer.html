<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Panel Pembeli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f8f9fa; color: #1e293b; padding: 20px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 15px 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .nav-brand { font-size: 1.25rem; font-weight: 800; }
        .catalog-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 18px; border-radius: 20px; border: 1px solid #e2e8f0; }
        .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
        .video-container { width: 100%; height: 150px; margin-bottom: 12px; overflow: hidden; border-radius: 10px; background: #000; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .title { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
        .price { font-size: 1rem; font-weight: 700; color: #3b82f6; margin-bottom: 8px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">GadgetStore Pro</div>
    </nav>

    <div class="catalog-container" id="catalogContainer"></div>

    <script>
        // Paksa pembaruan data ke versi baru
        localStorage.setItem('tokoVersiApp', 'v8.0_custom_links');

        const produkDefault = [
            {
                nama: "iPhone 15 Pro",
                harga: "18500000",
                kategori: "Smartphone",
                deskripsi: "Smartphone flagship.",
                foto: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500",
                // Mengambil ID dari link: rkLpVyRGCPw
                video: "https://www.youtube.com/embed/rkLpVyRGCPw"
            },
            {
                nama: "Laptop ASUS ROG",
                harga: "22000000",
                kategori: "Laptop",
                deskripsi: "Laptop gaming bertenaga.",
                foto: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=500",
                // Mengambil ID dari link: DSZE5C_I9xE
                video: "https://www.youtube.com/embed/DSZE5C_I9xE"
            }
        ];
        localStorage.setItem('tokoProduk', JSON.stringify(produkDefault));

        function muatProdukDariAdmin() {
            const container = document.getElementById('catalogContainer');
            let listProduk = JSON.parse(localStorage.getItem('tokoProduk'));

            container.innerHTML = '';

            listProduk.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${prod.foto}" class="product-img">
                    <div class="title">${prod.nama}</div>
                    <div class="price">Rp ${Number(prod.harga).toLocaleString('id-ID')}</div>
                    <div class="video-container">
                        <iframe src="${prod.video}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                        </iframe>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        muatProdukDariAdmin();
    </script>
</body>
</html>
