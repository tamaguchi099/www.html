<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Panel Pembeli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #1e293b;
            padding: 30px;
        }
        /* Navbar Utama */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 30px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            margin-bottom: 25px;
            position: relative;
            z-index: 100;
        }
        .nav-brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
        }
        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-link {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-link:hover {
            color: #3b82f6;
        }

        /* --- CSS MENU DROPDOWN KATEGORI --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 180px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.1);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            top: 150%;
            left: -20px;
            overflow: hidden;
            z-index: 200;
        }
        .dropdown-content.show {
            display: block;
            animation: fadeIn 0.2s ease-in-out;
        }
        .dropdown-content a {
            color: #475569;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
