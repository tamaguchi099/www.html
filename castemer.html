<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilstore - Gadget Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--dark); padding-bottom: 50px; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: white; }
        .nav-brand { font-weight: 800; font-size: 1.5rem; color: var(--primary); }
        .nav-menu { display: flex; gap: 20px; align-items: center; }
        .nav-link { text-decoration: none; color: #475569; font-weight: 600; font-size: 0.9rem; }
        .nav-logout { background: #fee2e2; color: #991b1b; padding: 6px 15px; border-radius: 20px; text-decoration: none; font-weight: 700; font-size: 0.8rem; }

        /* Hero Section */
        .hero { background: var(--primary); color: white; padding: 40px 5%; text-align: center; border-radius: 0 0 30px 30px; margin-bottom: 30px; }
        .hero h1 { font-size: 2rem; margin-bottom: 15px; }
        .hero-img { width: 90%; max-width: 500px; border-radius: 20px; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        /* Catalog */
        .container { padding: 0 5%; }
        .section-title { font-size: 1.3rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .catalog-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; }
        .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; }
        .title { font-weight: 700; margin: 10px 0; }
        .price { color: var(--primary); font-weight: 800; font-size: 1.1rem; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .buy-btn { flex: 1; background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .cart-btn { flex: 1; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        /* Modal & Utils */
        .cart-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .cart-modal.show { display: flex; }
        .cart-modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; }
        .checkout-btn { width: 100%; background: var(--dark); color: white; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">Hilstore</div>
        <div class="nav-menu">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link" id="cartMenuLink">🛒(0)</a>
            <a href="#" class="nav-link" onclick="bukaMenuPesan(event)">Pesan</a>
            <a href="#" class="nav-logout">Logout</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Belanja Lebih Mudah & Hemat</h1>
        <p>Nikmati promo spesial diskon hingga 70% untuk produk pilihan.</p>
        <img src="https://images.unsplash.com/photo-1523381210434-27158be1f5e6?w=800" class="hero-img" alt="Promo">
    </div>

    <div class="container">
        <h2 class="section-title">🔥 Produk Populer</h2>
        <div class="catalog-container" id="catalogContainer"></div>
    </div>

    <!-- Modals (Tetap sama seperti logika sebelumnya) -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <h3>Keranjang</h3>
            <div id="cartItemsContainer" style="margin: 15px 0;"></div>
            <button class="checkout-btn" onclick="bukaCheckoutDariKeranjang()">Checkout</button>
        </div>
    </div>

    <script>
        // Gunakan script logika yang sama dengan sebelumnya (tetap berfungsi sama)
        // [Fungsi cekDanInisialisasiDataDefault, muatProdukDariAdmin, dll. tetap sama]
        // Anda bisa menempelkan kembali fungsi JavaScript Anda yang sebelumnya di sini.
    </script>
</body>
</html>
